<title>Little Dragon Mandarin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
/* Layout: one calm column. Jade is the action colour, seal red marks pinyin and tones. Tones also get four fixed hues so a child can see them. */
:root {
  --bg: #eef4f1; --surface: #ffffff; --ink: #12292d; --muted: #4f676a; --line: #cfdfda; --soft: #e1ece8;
  --accent: #0d7a69; --accent-ink: #ffffff; --seal: #c23b2e; --seal-ink: #ffffff; --gold: #f1b64a;
  --good-bg: #d6f2e4; --good: #17855a; --bad-bg: #fce3df; --bad: #c23b2e; --paper: #fffdf6; --paper-line: #efb3ac;
  --t1: #1d6bb0; --t2: #17855a; --t3: #a86408; --t4: #c23b2e; --t5: #66797c;
  --hanzi: "Noto Serif SC", "KaiTi", "Kaiti SC", "STKaiti", "AR PL UKai CN", "PingFang SC", "Microsoft YaHei", serif;
  --ui: "Nunito", "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1a1c; --surface: #162528; --ink: #e5efed; --muted: #9bb3b1; --line: #2a4144; --soft: #1e3235;
    --accent: #3cc2aa; --accent-ink: #052019; --seal: #ff7d6e; --seal-ink: #2b0d09; --gold: #f1b64a;
    --good-bg: #123828; --good: #4fd49a; --bad-bg: #44201c; --bad: #ff7d6e; --paper-line: #b5605a;
    --t1: #6db4f0; --t2: #4fd49a; --t3: #f0b04a; --t4: #ff7d6e; --t5: #9bb3b1;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1a1c; --surface: #162528; --ink: #e5efed; --muted: #9bb3b1; --line: #2a4144; --soft: #1e3235;
  --accent: #3cc2aa; --accent-ink: #052019; --seal: #ff7d6e; --seal-ink: #2b0d09; --gold: #f1b64a;
  --good-bg: #123828; --good: #4fd49a; --bad-bg: #44201c; --bad: #ff7d6e; --paper-line: #b5605a;
  --t1: #6db4f0; --t2: #4fd49a; --t3: #f0b04a; --t4: #ff7d6e; --t5: #9bb3b1;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 17px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.top, #app { max-width: 640px; margin: 0 auto; }
.top { display: flex; justify-content: space-between; align-items: center; padding: 12px 0 4px; }
.logo { background: none; border: 0; font-size: 1.15rem; font-weight: 800; color: var(--ink); padding: 4px 0; }
.logo span { font-family: var(--hanzi); letter-spacing: .08em; }
#starTotal { font-weight: 800; background: var(--soft); padding: 3px 12px; border-radius: 99px; }

.hero { text-align: center; padding: 10px 0 6px; }
.dragon { font-size: 3rem; animation: bob 2.6s ease-in-out infinite; }
.hero h1 { margin: 0; font-family: var(--hanzi); font-size: 2.3rem; letter-spacing: .1em; text-wrap: balance; }
.hero p { margin: 8px auto 0; color: var(--muted); max-width: 30em; text-wrap: balance; }
@keyframes bob { 50% { transform: translateY(-7px) rotate(-4deg); } }

.daily { margin-top: 16px; background: var(--surface); border: 2px solid var(--accent); border-radius: 20px; padding: 14px; }
.dTop { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.daily h2 { margin: 0; font-size: 1.25rem; }
.daily p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
.streak { flex: 0 0 auto; text-align: center; background: var(--soft); border-radius: 14px; padding: 6px 12px; line-height: 1.1; }
.streak b { display: block; font-size: 1.9rem; color: var(--seal); font-variant-numeric: tabular-nums; }
.streak span { font-size: .75rem; color: var(--muted); font-weight: 700; }
.week { display: flex; justify-content: space-between; gap: 6px; margin: 12px 0; }
.dayDot { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .75rem; font-weight: 700; color: var(--muted); flex: 1; }
.dayDot i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); background: var(--bg); }
.dayDot.on i { background: var(--accent); border-color: var(--accent); }
.dayDot.today { color: var(--ink); }
.dayDot.today i { box-shadow: 0 0 0 3px var(--gold); }
.wide { width: 100%; }

.path { list-style: none; margin: 16px 0; padding: 0; display: grid; gap: 12px; }
.lvl { display: flex; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 14px; }
.lvl.locked { opacity: .8; }
.num { flex: 0 0 36px; height: 36px; border-radius: 50%; background: var(--gold); color: #2a2208; display: grid; place-items: center; font-weight: 800; }
.lvlBody { min-width: 0; }
.lvlBody h2 { margin: 0; font-size: 1.2rem; }
.lvlBody p { margin: 2px 0 6px; color: var(--muted); font-size: .95rem; }
.lockMsg { font-style: italic; }
.zhs { font-family: var(--hanzi); color: var(--seal); }
.stars { color: var(--gold); font-size: 1.3rem; letter-spacing: 2px; }
.btns, .nav { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.btns.center { justify-content: center; }
.nav { justify-content: space-between; margin-top: 14px; }

.btn { border: 0; border-radius: 14px; padding: 10px 16px; font-weight: 800; background: var(--accent); color: var(--accent-ink); box-shadow: 0 3px 0 rgba(0,0,0,.22); }
.btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 rgba(0,0,0,.22); }
.btn.play { background: var(--seal); color: var(--seal-ink); }
.btn.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); box-shadow: 0 3px 0 var(--line); }
.link { background: none; border: 0; color: var(--accent); text-decoration: underline; font-weight: 700; padding: 4px 0; }
.foot { text-align: center; color: var(--muted); font-size: .9rem; }

.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 0 6px; }
.bar .title { font-weight: 800; text-align: center; }
.back { background: none; border: 0; color: var(--accent); font-weight: 800; padding: 6px 0; }
.count { min-width: 60px; text-align: right; color: var(--muted); font-weight: 700; }
.prog { height: 8px; background: var(--soft); border-radius: 9px; overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.tabs { display: flex; gap: 6px; margin: 10px 0 2px; overflow-x: auto; padding-bottom: 4px; }
.tab { border: 2px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 14px; font-weight: 700; white-space: nowrap; }
.tab.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.modes .tab { flex: 1; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; margin-top: 12px; text-align: center; }
.card h3 { margin: 2px 0 0; font-size: 1.3rem; text-wrap: balance; }
.tag { display: table; margin: 0 auto 4px; background: var(--gold); color: #2a2208; border-radius: 99px; padding: 2px 12px; font-size: .8rem; font-weight: 800; }
.letterRow { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0; flex-wrap: wrap; }
.letterBig { font-size: 4.4rem; font-weight: 800; line-height: 1; color: var(--seal); font-family: "Andika", "Trebuchet MS", sans-serif; }
.letterBig.zh { font-family: var(--hanzi); }
.letterBig.mark { font-size: 4rem; }
.hint { background: var(--soft); border-radius: 14px; padding: 8px 12px; margin: 10px 0; text-align: left; }
.note { color: var(--muted); font-size: .92rem; margin: 6px 0 0; }
.cap { margin: 8px 0 2px; font-weight: 700; color: var(--muted); font-size: .92rem; }
.peek { margin: 10px 0 0; color: var(--muted); }
.peek .hz { font-size: 1.6rem; color: var(--ink); }
.speak { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 6px 12px; font-weight: 800; box-shadow: 0 3px 0 rgba(0,0,0,.22); }
.speak.pill { font-size: .95rem; }
.speak.bigspeak { font-size: 2.4rem; padding: 12px 26px; background: var(--seal); color: var(--seal-ink); }

.fourline { width: min(300px, 100%); height: auto; display: block; margin: 4px auto; }
.fourline .fl { stroke: var(--line); stroke-width: .8; }
.fourline .base { stroke: var(--seal); stroke-width: .9; stroke-dasharray: 3 2; }
.fourline text { fill: var(--ink); font-family: "Andika", "Trebuchet MS", sans-serif; }

.wordCard { display: flex; width: fit-content; max-width: 100%; flex-direction: column; align-items: center; gap: 2px; background: var(--bg); border: 2px dashed var(--line); border-radius: 18px; padding: 10px 18px; margin: 6px auto; }
.wordCard.row { flex-direction: row; justify-content: center; gap: 12px; flex-wrap: wrap; width: auto; margin-top: 12px; }
.wordCard .pic { font-size: 3.2rem; line-height: 1.1; }
.pic { font-size: 3rem; line-height: 1.1; }
.pic.huge { font-size: 5.5rem; }
.hz { font-family: var(--hanzi); font-size: 2.4rem; line-height: 1.15; }
.hz.huge { font-size: 4.6rem; }
.hz mark { background: var(--gold); color: #2a2208; border-radius: 6px; padding: 0 2px; }
.py { font-size: 1.4rem; font-weight: 800; color: var(--seal); }
.py.big { font-size: 1.5rem; }
.py.huge { font-size: 4.4rem; }
.py.phr { font-size: 2rem; line-height: 1.2; }
.en { color: var(--muted); }
.en.big { font-size: 1.35rem; font-weight: 800; color: var(--ink); margin-top: 2px; }
.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { color: var(--t5); }

.ribbon { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 6px 0; }
.syl { display: flex; flex-direction: column; align-items: center; background: var(--bg); border-radius: 12px; padding: 4px 8px; font-weight: 800; }
.syl span { font-size: 1rem; }
.syl .contour .tp { stroke: currentColor; } .syl .contour .td { fill: currentColor; }
.gRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; text-align: left; border-top: 1px solid var(--line); padding: 10px 0; }
.gRow:first-of-type { margin-top: 6px; }
.gRow .hz { font-size: 2rem; } .gRow .py { font-size: 1.15rem; }
.sentence .py { margin-top: 4px; }

.writeBox { margin-top: 10px; }
canvas.mini { width: min(230px, 70vw); aspect-ratio: 1; border-radius: 14px; border: 2px solid var(--paper-line); }
.chips { list-style: none; display: flex; flex-wrap: wrap; gap: 6px; padding: 0; margin: 8px 0 0; justify-content: center; }
.chips li { background: var(--soft); border-radius: 99px; padding: 2px 10px; font-family: var(--hanzi); font-size: 1.05rem; }
.chips small { font-family: var(--ui); color: var(--muted); }
.chips b { color: var(--seal); font-family: var(--ui); }

.contour { width: 90px; height: 90px; }
.contour.big { width: 150px; height: 150px; display: block; margin: 6px auto; }
.contour.optShape { width: 76px; height: 76px; }
.contour.mini { width: 44px; height: 44px; }
.contour .pl { stroke: var(--line); stroke-width: .6; }
.contour .tp { fill: none; stroke: var(--seal); stroke-width: 4; stroke-linecap: round; }
.contour .td { fill: var(--seal); }

.strokeAnim { width: min(240px, 70vw); display: block; margin: 8px auto; }
.strokeAnim .gbox { fill: var(--paper); stroke: var(--paper-line); stroke-width: 1.2; }
.strokeAnim .gl { stroke: var(--paper-line); stroke-width: .6; stroke-dasharray: 3 3; opacity: .6; }
.strokeAnim .guide { fill: none; stroke: #e8e1cf; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.strokeAnim .draw { fill: none; stroke: #073b4c; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: drawIn 2.2s ease-in-out infinite; }
.strokeAnim .start { fill: var(--gold); stroke: var(--seal); stroke-width: 1.5; }
.options .strokeAnim { width: 70px; }
@keyframes drawIn { 0% { stroke-dashoffset: 1; } 55%, 100% { stroke-dashoffset: 0; } }

.quiz { margin-top: 12px; text-align: center; }
.qMain { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; margin: 12px 0 4px; }
.ask { font-size: 1.2rem; font-weight: 800; margin: 6px 0 14px; text-wrap: balance; }
.retry { text-align: center; color: var(--seal); font-weight: 800; margin: 10px 0 0; }
.options { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
.opt { min-width: 0; min-height: 74px; background: var(--surface); border: 3px solid var(--line); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 8px; box-shadow: 0 3px 0 var(--line); }
.opt:active:not(:disabled) { transform: translateY(2px); }
.opt.right { background: var(--good-bg); border-color: var(--good); }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); animation: shake .35s; }
.opt:disabled { opacity: 1; }
.optL { font-size: 2.2rem; font-weight: 800; font-family: "Andika", "Trebuchet MS", sans-serif; }
.optPic { font-size: 3.2rem; line-height: 1.1; }
.optZh { font-family: var(--hanzi); font-size: 2.4rem; line-height: 1.1; }
.optPy { font-size: 1.2rem; font-weight: 800; color: var(--seal); overflow-wrap: anywhere; }
.optEn { font-size: 1.1rem; font-weight: 700; overflow-wrap: anywhere; }
.opt small { color: var(--muted); font-size: .9rem; }
.hzs { font-family: var(--hanzi); }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }

.slots, .bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; min-height: 64px; }
.slots { padding: 10px; background: var(--soft); border-radius: 16px; margin-bottom: 12px; }
.slot { width: 64px; height: 56px; border: 2px dashed var(--line); border-radius: 12px; }
.tile { display: flex; flex-direction: column; align-items: center; min-width: 64px; background: var(--surface); border: 3px solid var(--line); border-radius: 14px; padding: 6px 12px; box-shadow: 0 3px 0 var(--line); }
.tile b { font-size: 1.2rem; color: var(--seal); }
.tile span { font-family: var(--hanzi); font-size: 1.1rem; color: var(--muted); }
.tile.placed { border-color: var(--accent); }
.tile.right { background: var(--good-bg); border-color: var(--good); }
.tile.wrong { background: var(--bad-bg); border-color: var(--bad); }
#bwrap .btn { margin-top: 14px; }

.fb { margin-top: 16px; border-radius: 20px; padding: 12px; }
.fb.good { background: var(--good-bg); }
.fb.bad { background: var(--bad-bg); }
.verdict { font-weight: 800; font-size: 1.2rem; margin-bottom: 4px; }
.fb .card { box-shadow: none; }
.fb .btn { margin-top: 12px; }

.result { text-align: center; padding: 30px 0; }
.result .big { font-size: 5rem; animation: bob 2s ease-in-out infinite; }
.result h2 { font-size: 2.6rem; margin: 0; color: var(--gold); letter-spacing: 4px; }
.result .btns { justify-content: center; }
.streakMsg { font-weight: 800; color: var(--seal); }

.lead { text-align: center; color: var(--muted); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 10px; }
.cell { position: relative; background: var(--surface); border: 3px solid var(--line); border-radius: 16px; padding: 8px 4px; display: flex; flex-direction: column; align-items: center; box-shadow: 0 3px 0 var(--line); }
.cell .hz { font-size: 2.4rem; }
.cell small { color: var(--seal); font-weight: 800; }
.cell.done { border-color: var(--good); background: var(--good-bg); }
.cell i { position: absolute; top: 2px; right: 8px; color: var(--good); font-style: normal; font-weight: 800; }

.writeWrap { margin-top: 10px; display: grid; place-items: center; }
#wc { width: min(380px, 100%); aspect-ratio: 1; border-radius: 18px; border: 3px solid var(--paper-line); background: var(--paper); cursor: crosshair; }
.wfb { margin: 10px 0 0; padding: 10px 12px; border-radius: 14px; background: var(--soft); text-align: center; font-weight: 700; min-height: 3.2em; }
.wfb.ok { background: var(--good-bg); }
.wfb.bad { background: var(--bad-bg); }

#toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 120px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 14px; max-width: 90vw; transition: transform .25s; z-index: 10; text-align: center; }
#toast.show { transform: translate(-50%, 0); }
#toast:not(.show) { visibility: hidden; }

@media (min-width: 560px) { .options.pics, .options.letters, .options.shapes { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 380px) { .options.texts { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } .strokeAnim .draw { stroke-dashoffset: 0; } }

</style>
<header class="top">
  <button id="homeBtn" class="logo" aria-label="Home">🐉 <span>小龙学中文</span></button>
  <div id="starTotal" aria-label="Total stars">⭐ 0</div>
</header>
<main id="app" aria-live="polite"></main>
<div id="toast" role="status"></div>
<script>
/* Little Dragon Mandarin — lesson data.
 * Everything the game teaches lives here, so you can add content without touching game code.
 * Pictures are emoji so the project has no image files and works fully offline.
 */
(function (root) {
  'use strict';
  var MD = root.MD = root.MD || {};

  /* ---------- Level 1: pinyin sounds ---------- */
  // id = the letter(s); syl = traditional "name" syllable; say = a character spoken aloud for that sound;
  // word = example word whose pinyin starts with / contains the sound; tl = toneless pinyin (used by quizzes).
  MD.INITIALS = [
    { id: 'b',  syl: 'bo',  say: '波', hint: 'Like the “p” in “spy”: lips pop open, no puff of air.', word: { hz: '八', py: 'bā', tl: 'ba', en: 'eight', pic: '8️⃣' } },
    { id: 'p',  syl: 'po',  say: '坡', hint: 'Like the “p” in “pie”: lips pop open WITH a puff of air. A tissue in front of your mouth should flutter!', word: { hz: '苹果', py: 'píng guǒ', tl: 'pingguo', en: 'apple', pic: '🍎' } },
    { id: 'm',  syl: 'mo',  say: '摸', hint: 'Like the “m” in “mom”. Lips together, hum.', word: { hz: '猫', py: 'māo', tl: 'mao', en: 'cat', pic: '🐱' } },
    { id: 'f',  syl: 'fo',  say: '佛', hint: 'Like the “f” in “fun”. Top teeth on bottom lip.', word: { hz: '飞机', py: 'fēi jī', tl: 'feiji', en: 'airplane', pic: '✈️' } },
    { id: 'd',  syl: 'de',  say: '得', hint: 'Like the “t” in “sty”: tongue taps behind top teeth, no puff.', word: { hz: '大象', py: 'dà xiàng', tl: 'daxiang', en: 'elephant', pic: '🐘' } },
    { id: 't',  syl: 'te',  say: '特', hint: 'Like the “t” in “top”, with a puff of air.', word: { hz: '兔子', py: 'tù zi', tl: 'tuzi', en: 'rabbit', pic: '🐰' } },
    { id: 'n',  syl: 'ne',  say: '讷', hint: 'Like the “n” in “no”.', word: { hz: '牛', py: 'niú', tl: 'niu', en: 'cow', pic: '🐮' } },
    { id: 'l',  syl: 'le',  say: '勒', hint: 'Like the “l” in “look”.', word: { hz: '龙', py: 'lóng', tl: 'long', en: 'dragon', pic: '🐉' } },
    { id: 'g',  syl: 'ge',  say: '哥', hint: 'Like the “k” in “sky”: back of the tongue lifts, no puff.', word: { hz: '狗', py: 'gǒu', tl: 'gou', en: 'dog', pic: '🐶' } },
    { id: 'k',  syl: 'ke',  say: '科', hint: 'Like the “k” in “kite”, with a puff of air.', word: { hz: '咖啡', py: 'kā fēi', tl: 'kafei', en: 'coffee', pic: '☕' } },
    { id: 'h',  syl: 'he',  say: '喝', hint: 'Like “h” in “hat”, but a little more scratchy from the back of the throat.', word: { hz: '花', py: 'huā', tl: 'hua', en: 'flower', pic: '🌸' } },
    { id: 'j',  syl: 'ji',  say: '基', hint: 'Like the “j” in “jeep”, with lips spread wide in a smile.', word: { hz: '鸡', py: 'jī', tl: 'ji', en: 'chicken', pic: '🐔' } },

/* Stroke geometry + the "did you draw it right?" checker.
 * Pure functions with no DOM access, so they are easy to test with `node tests/check.js`.
 */
(function (root) {
  'use strict';
  var MD = root.MD = root.MD || {};

  var DIRS = ['right', 'downright', 'down', 'downleft', 'left', 'upleft', 'up', 'upright'];
  var ARROW = { right: '→', downright: '↘', down: '↓', downleft: '↙', left: '←', upleft: '↖', up: '↑', upright: '↗' };
  var HOW = {
    right: 'from left to right →', downright: 'down to the right ↘', down: 'from top to bottom ↓',
    downleft: 'down to the left ↙', left: 'from right to left ←', upleft: 'up to the left ↖',
    up: 'upwards ↑', upright: 'up to the right ↗'
  };

  function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); }
  function pathLen(pts) {
    var s = 0;
    for (var i = 1; i < pts.length; i++) { s += dist(pts[i - 1], pts[i]); }
    return s;
  }
  function lenUpTo(pts, idx) { return pathLen(pts.slice(0, idx + 1)); }

  // Point at a fraction (0..1) of the way along a polyline.
  function pointAt(pts, frac) {
    var target = pathLen(pts) * frac, acc = 0;
    for (var i = 1; i < pts.length; i++) {
      var seg = dist(pts[i - 1], pts[i]);
      if (acc + seg >= target && seg > 0) {
        var t = (target - acc) / seg;
        return [pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t];
      }
      acc += seg;
    }
    return pts[pts.length - 1];
  }

  // The first `frac` of a polyline (used for the draw-on animation).
  function partial(pts, frac) {
    if (frac >= 1) { return pts; }
    var target = pathLen(pts) * frac, acc = 0, out = [pts[0]];
    for (var i = 1; i < pts.length; i++) {
      var seg = dist(pts[i - 1], pts[i]);
      if (acc + seg >= target) {
        var t = seg ? (target - acc) / seg : 0;
        out.push([pts[i - 1][0] + (pts[i][0] - pts[i - 1][0]) * t, pts[i - 1][1] + (pts[i][1] - pts[i - 1][1]) * t]);
        return out;
      }
      out.push(pts[i]);
      acc += seg;
    }
    return out;
  }

  function dirIndex(dx, dy) {
    var a = Math.atan2(dy, dx) * 180 / Math.PI;
    var i = Math.round(a / 45);
    return ((i % 8) + 8) % 8;
  }
  function dirOf(a, b) { return dirIndex(b[0] - a[0], b[1] - a[1]); }
  function sectorDiff(a, b) { var d = Math.abs(a - b) % 8; return Math.min(d, 8 - d); }

  function drawnDirs(exp, drawn) {
    var s = drawn[0], e = drawn[drawn.length - 1];

    var frac = lenUpTo(exp.pts, exp.corner) / pathLen(exp.pts);

   *   strokes: the character's expected strokes, i: which one the child should draw now,
   *   drawn: array of [x, y] on the 100x100 grid, tol: how far from the guide is acceptable.

      return { ok: false, code: 'short', msg: 'Make the stroke a little longer.' };
    }
    var m = match(exp, drawn, tol);
    if (m.dirOk && m.posOk) {
      return { ok: true, code: 'ok', msg: '✓ ' + exp.zh + ' ' + exp.py + ': well done!' };
    }
    for (var k = i + 1; k < strokes.length; k++) {
      var mk = match(strokes[k], drawn, 14);

        return { ok: false, code: 'order', later: k,
          msg: 'Careful with the order! That looks like stroke ' + (k + 1) + ' (' + strokes[k].zh + ' ' + strokes[k].py +
               '). Stroke ' + (i + 1) + ' comes first: ' + exp.zh + ' ' + exp.py + '. Rule: top before bottom, left before right.' };
      }
    }
    if (!m.dirOk) {
      var went = m.dirs.map(function (d) { return ARROW[DIRS[d]]; }).join(' then ');
      return { ok: false, code: 'dir',
        msg: 'Not quite: that went ' + went + '. Stroke ' + (i + 1) + ' is ' + exp.zh + ' (' + exp.py + '): draw it ' + howText(exp.dirs) + '.' };
    }

      msg: 'Right shape, wrong place! Start closer to the guide for stroke ' + (i + 1) + ' (' + exp.zh + ' ' + exp.py + ').' };
  }

  function byTile(B, id) { return B.tiles.filter(function (t) { return t.id === id; })[0]; }
  function tileHtml(t, cls, act) { return '<button class="tile ' + cls + '" data-act="' + act + '" data-id="' + t.id + '"><b>' + esc(t.py) + '</b><span>' + t.hz + '</span></button>'; }
  function buildInner(q, pick, done) {
    var B = q.build, slots = '', bank = '', i;
    for (i = 0; i < B.tiles.length; i++) {
      if (pick[i] !== undefined) {
        var t = byTile(B, pick[i]);
        slots += tileHtml(t, done ? (t.hz === B.answer[i] ? 'right' : 'wrong') : 'placed', done ? 'none' : 'untile');
      } else { slots += '<span class="slot"></span>'; }
    }
    if (!done) {
      bank = B.tiles.filter(function (t) { return pick.indexOf(t.id) < 0; }).map(function (t) { return tileHtml(t, '', 'tile'); }).join('');
    }
    return '<div class="slots">' + slots + '</div><div class="bank">' + bank + '</div>' +
      (done ? '' : '<button class="btn" data-act="check"' + (pick.length === B.tiles.length ? '' : ' disabled') + '>Check</button>');
  }
  function buildHtml(q) { return '<div id="bwrap">' + buildInner(q, [], false) + '</div>'; }

  function buildQ(b) {
    var tiles = b.words.map(function (w, i) { return { id: i, hz: w.hz, py: w.py }; }), sh, tries = 0;
    do { sh = shuffle(tiles); tries++; } while (tries < 8 && sh.map(function (t) { return t.id; }).join() === tiles.map(function (t) { return t.id; }).join());
    var whole = { hz: b.words.map(function (w) { return w.hz; }).join(''), py: b.words.map(function (w) { return w.py; }).join(' ') };
    return {
      build: { tiles: sh, answer: b.words.map(function (w) { return w.hz; }) },
      prompt: '<div class="qMain"><div class="pic huge">' + b.pic + '</div></div><p class="ask">Build the sentence:<br><b>' + esc(b.en) + '</b></p><p class="note">Tap the words in order.</p>',
      say: whole.hz,
      explain: function () { return sentenceCard(whole, b.en, b.pic) + '<p class="hint">💡 ' + esc(b.note) + '</p>'; }
    };
  }
  function pickQ(d) {
    var sh = shuffle(d.options.map(function (o, i) { return { i: i, o: o }; }));
    return {
      prompt: '<div class="qMain"><div class="pic huge">' + d.pic + '</div></div><p class="ask">Which sentence means<br><b>' + esc(d.en) + '</b>?</p>',
      options: sh.map(function (x) { return { key: x.i, html: '<span class="optPy">' + esc(x.o.py) + '</span><small class="hzs">' + x.o.hz + '</small>' }; }),
      correct: 0, cls: 'texts', say: d.options[0].hz,
      explain: function () { return sentenceCard(d.options[0], d.en, d.pic) + '<p class="hint">💡 ' + esc(d.note) + '</p>'; }
    };
  }
  function grammarQ(it) { return it.kind === 'build' ? buildQ(it.d) : pickQ(it.d); }

  function poolFor(level) {
    if (level === 'sounds') { return MD.INITIALS.concat(MD.FINALS); }
    if (level === 'tones') { return toneItems(); }
    if (level === 'strokes') { return MD.STROKE_TYPES.concat(MD.CHARS); }
    if (level === 'phrases') { return MD.PHRASES; }
    return MD.BUILD.map(function (d) { return { kind: 'build', d: d }; }).concat(MD.PICKS.map(function (d) { return { kind: 'pick', d: d }; }));
  }
  function makeQ(level, it) {
    return { sounds: soundQ, tones: toneQ, strokes: strokeQ, phrases: phraseQ, grammar: grammarQ }[level](it);
  }

  /* ---------------- views ---------------- */
  var S = { view: 'home', cards: [], ci: 0, level: null, quiz: null, writer: null, wch: null };
  var minis = [];

  function paint(html) {
    app.innerHTML = html;
    window.scrollTo(0, 0);
    var t = document.getElementById('starTotal'); if (t) { t.textContent = '⭐ ' + store.total(); }
    minis = [];
    var cvs = app.querySelectorAll('canvas.mini');
    for (var i = 0; i < cvs.length; i++) {
      var ch = MD.CHARS_BY[cvs[i].getAttribute('data-char')];
      if (ch) { var w = new Writer(cvs[i], ch, { mode: 'watch', repeat: true }); w.play(); minis.push(w); }
    }
  }

  function weekDots() {
    var out = '', i, t, names = ['S', 'M', 'T', 'W', 'T', 'F', 'S'];
    for (i = 6; i >= 0; i--) {
      t = new Date(); t.setDate(t.getDate() - i);
      out += '<div class="dayDot' + (store.hasDay(dayKey(t)) ? ' on' : '') + (i === 0 ? ' today' : '') + '"><i></i><span>' + names[t.getDay()] + '</span></div>';
    }
    return out;
  }
  function viewHome() {
    S.view = 'home'; S.resetArmed = false;
    var done = store.hasDay(dayKey(new Date())), n = store.streak();
    var open = store.stars('sounds') > 0 && store.stars('tones') > 0 && store.stars('phrases') > 0;
    var items = LEVELS.map(function (l) {
      var locked = l.id === 'strokes' && !open && !S.peek, body;
      if (locked) {
        body = '<p class="lockMsg">Opens after you earn a star in Sounds, Tones and Phrases. Hearing comes before writing.</p><button class="link" data-act="peek">Peek anyway</button>';
      } else {
        body = '<div class="btns"><button class="btn" data-act="learn" data-l="' + l.id + '">👀 Learn</button>' +
          '<button class="btn play" data-act="play" data-l="' + l.id + '">🎮 Play</button>' +
          (l.id === 'strokes' ? '<button class="btn alt" data-act="write">✏️ Write</button>' : '') + '</div>';
      }
      return '<li class="lvl' + (locked ? ' locked' : '') + '"><div class="num">' + l.n + '</div><div class="lvlBody"><h2>' + l.icon + ' ' + l.title + ' <span class="zhs">' + l.zh + '</span></h2>' +
        '<p>' + l.sub + '</p><div class="stars" aria-label="' + store.stars(l.id) + ' of 3 stars">' + stars(store.stars(l.id)) + '</div>' + body + '</div></li>';
    }).join('');
    paint('<section class="hero"><div class="dragon">🐉</div><h1>小龙学中文</h1><p>Learn Mandarin the way children do: <b>sounds</b>, then <b>tones</b>, then <b>everyday phrases</b>. Characters come last.</p></section>' +
      '<section class="daily"><div class="dTop"><div><h2>Today’s 5 minutes</h2><p>Five quick questions from everything you are learning. A little every day beats a lot once a week.</p></div>' +
      '<div class="streak"><b>' + n + '</b><span>day streak</span></div></div>' +
      '<div class="week" aria-label="Last seven days">' + weekDots() + '</div>' +
      '<button class="btn play wide" data-act="play" data-l="daily">' + (done ? '✓ Done today. Practice again' : '☀️ Start today’s 5') + '</button></section>' +
      '<ol class="path">' + items + '</ol>' +
      '<p class="foot">Turn your sound on: the 🔊 buttons use your device’s built-in Mandarin voice.<br><button class="link" data-act="reset">Reset progress</button></p>');
  }

  function viewLearn(level, startIdx) {
    S.view = 'learn'; S.level = level;
    if (!S.cards.length || S.cardsLevel !== level) { S.cards = learnCards(level); S.cardsLevel = level; }
    S.ci = Math.max(0, Math.min(S.cards.length - 1, startIdx || 0));
    var c = S.cards[S.ci], L = LEVEL_BY[level], last = S.ci === S.cards.length - 1;
    var groups = [];
    S.cards.forEach(function (x, i) { if (!groups.length || groups[groups.length - 1].g !== x.group) { groups.push({ g: x.group, i: i }); } });
    var tabs = groups.length > 1 ? '<div class="tabs">' + groups.map(function (g) {
      return '<button class="tab' + (g.g === c.group ? ' on' : '') + '" data-act="jump" data-i="' + g.i + '">' + g.g + '</button>'; }).join('') + '</div>' : '';
    paint('<div class="bar"><button class="back" data-act="home">← Home</button><div class="title">' + L.icon + ' ' + L.title + ' · Learn</div><div class="count">' + (S.ci + 1) + '/' + S.cards.length + '</div></div>' +
      '<div class="prog"><i style="width:' + ((S.ci + 1) / S.cards.length * 100) + '%"></i></div>' + tabs + c.html +
      '<div class="nav"><button class="btn alt" data-act="prev"' + (S.ci === 0 ? ' disabled' : '') + '>← Back</button>' +
      (last ? '<button class="btn play" data-act="play" data-l="' + level + '">🎮 Play!</button>' : '<button class="btn" data-act="next">Next →</button>') + '</div>');
  }

  function startQuiz(level) {
    var items;
    if (level === 'daily') {
      items = shuffle(['sounds', 'tones', 'phrases', 'phrases', 'grammar']).map(function (l) { return { target: rand(poolFor(l)), retry: false, lvl: l }; });
    } else {
      items = sample(poolFor(level), 8).map(function (t) { return { target: t, retry: false }; });
    }
    S.quiz = { level: level, queue: items, total: items.length, correct: 0, cur: null };
    nextQuestion();
  }
  function nextQuestion() {
    var Q = S.quiz;
    if (!Q.queue.length) { return finishQuiz(); }
    S.view = 'play';
    var item = Q.queue[0], q = makeQ(item.lvl || Q.level, item.target), L = LEVEL_BY[Q.level];
    Q.cur = { q: q, item: item, answered: false, pick: [] };
    var remaining = Q.queue.filter(function (x) { return !x.retry; }).length, doneN = Q.total - remaining;
    var opts = q.build ? '' : q.options.map(function (o, i) { return optBtn(i, o.html); }).join('');
    paint('<div class="bar"><button class="back" data-act="home">← Home</button><div class="title">' + L.icon + ' ' + L.title + ' · Play</div><div class="count">' + (item.retry ? '🔁' : (doneN + 1) + '/' + Q.total) + '</div></div>' +
      '<div class="prog"><i style="width:' + (doneN / Q.total * 100) + '%"></i></div>' +
      (item.retry ? '<p class="retry">Let’s try that one again! 💪</p>' : '') +
      '<div class="quiz">' + q.prompt + (q.build ? buildHtml(q) : '<div class="options ' + q.cls + '">' + opts + '</div>') + '<div id="fb"></div></div>');
    if (q.auto) { setTimeout(function () { speak(q.auto); }, 350); }
  }
  function answer(i) {
    var Q = S.quiz, C = Q.cur;
    if (!C || C.answered) { return; }
    C.answered = true;
    var q = C.q, ok = q.options[i].key === q.correct;
    var btns = app.querySelectorAll('button.opt');
    for (var k = 0; k < btns.length; k++) {
      btns[k].disabled = true;
      if (q.options[k].key === q.correct) { btns[k].classList.add('right'); }
    }
    if (!ok) { btns[i].classList.add('wrong'); }
    Q.queue.shift();
    if (ok) { if (!C.item.retry) { Q.correct++; } }
    else if (!C.item.retry) { Q.queue.push({ target: C.item.target, retry: true, lvl: C.item.lvl }); }
    var fb = document.getElementById('fb');
    fb.innerHTML = '<div class="fb ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' + (ok ? '🎉 Yes! Great job!' : '🤔 Not quite. Here is the right one:') + '</div>' +
      (ok ? '' : q.explain()) + '<button class="btn" data-act="nextq">' + (Q.queue.length ? 'Next →' : 'See my stars ⭐') + '</button></div>';
    var cvs = fb.querySelectorAll('canvas.mini');
    for (var m = 0; m < cvs.length; m++) {
      var ch = MD.CHARS_BY[cvs[m].getAttribute('data-char')];
      if (ch) { var w = new Writer(cvs[m], ch, { mode: 'watch', repeat: true }); w.play(); minis.push(w); }
    }
    fb.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (ok && (q.say || q.auto)) { speak(q.say || q.auto); }
  }
  function tapTile(id, add) {
    var C = S.quiz && S.quiz.cur;
    if (!C || C.answered || !C.q.build) { return; }
    var i = C.pick.indexOf(id);
    if (add && i < 0) { C.pick.push(id); } else if (!add && i >= 0) { C.pick.splice(i, 1); }
    document.getElementById('bwrap').innerHTML = buildInner(C.q, C.pick, false);
  }
  function checkBuild() {
    var Q = S.quiz, C = Q.cur;
    if (!C || C.answered || C.pick.length !== C.q.build.tiles.length) { return; }
    C.answered = true;
    var B = C.q.build, q = C.q;
    var ok = C.pick.every(function (id, i) { return byTile(B, id).hz === B.answer[i]; });
    document.getElementById('bwrap').innerHTML = buildInner(q, C.pick, true);
    Q.queue.shift();
    if (ok) { if (!C.item.retry) { Q.correct++; } }
    else if (!C.item.retry) { Q.queue.push({ target: C.item.target, retry: true, lvl: C.item.lvl }); }
    var fb = document.getElementById('fb');
    fb.innerHTML = '<div class="fb ' + (ok ? 'good' : 'bad') + '"><div class="verdict">' + (ok ? '🎉 Yes! Great job!' : '🤔 Not quite. The words go in this order:') + '</div>' +
      (ok ? '' : q.explain()) + '<button class="btn" data-act="nextq">' + (Q.queue.length ? 'Next →' : 'See my stars ⭐') + '</button></div>';
    fb.scrollIntoView({ behavior: 'smooth', block: 'center' });
    if (ok) { speak(q.say); }
  }

  function finishQuiz() {
    var Q = S.quiz, L = LEVEL_BY[Q.level], ratio = Q.correct / Q.total;
    var n = ratio >= 0.85 ? 3 : ratio >= 0.6 ? 2 : 1;
    if (Q.level === 'daily') { store.markDay(); } else { store.setStars(Q.level, n); }
    S.view = 'result';
    paint('<section class="result"><div class="big">' + (n === 3 ? '🏆' : n === 2 ? '🎉' : '👍') + '</div><h2>' + stars(n) + '</h2>' +
      '<p>' + Q.correct + ' of ' + Q.total + ' right the first time.</p>' + (Q.level === 'daily' ? '<p class="streakMsg">Day ' + store.streak() + ' in a row. Come back tomorrow to keep it going.</p>' : '') +
      '<p class="note">' + (n === 3 ? '好极了! (hǎo jí le: excellent!)' : n === 2 ? '很好! (hěn hǎo: very good!)' : '加油! (jiā yóu: keep going!)') + '</p>' +
      '<div class="btns"><button class="btn play" data-act="play" data-l="' + Q.level + '">🔁 Play again</button>' + (Q.level === 'daily' ? '' : '<button class="btn" data-act="learn" data-l="' + Q.level + '">👀 Review</button>') +
      '<button class="btn alt" data-act="home">🏠 Home</button></div></section>');
  }

  /* ---- writing practice ---- */
  function viewWriteMenu() {
    S.view = 'writemenu';
    var cells = MD.CHARS.map(function (c) {
      return '<button class="cell' + (store.written(c.ch) ? ' done' : '') + '" data-act="write" data-ch="' + c.ch + '"><span class="hz">' + c.ch + '</span><small>' + c.py + '</small>' + (store.written(c.ch) ? '<i>✓</i>' : '') + '</button>';
    }).join('');
    paint('<div class="bar"><button class="back" data-act="home">← Home</button><div class="title">✏️ Write</div><div class="count"></div></div>' +
      '<p class="lead">Pick a character to watch, trace and write from memory.</p><div class="cells">' + cells + '</div>');
  }
  function viewWrite(chStr, mode) {
    var c = MD.CHARS_BY[chStr]; if (!c) { return viewWriteMenu(); }
    S.view = 'write'; S.wch = c;
    var idx = MD.CHARS.indexOf(c), nextCh = MD.CHARS[(idx + 1) % MD.CHARS.length].ch;
    mode = mode || 'watch';
    paint('<div class="bar"><button class="back" data-act="writemenu">← Characters</button><div class="title">✏️ ' + c.ch + ' ' + c.py + '</div><div class="count">' + c.strokes.length + ' strokes</div></div>' +
      '<div class="tabs modes"><button class="tab" data-act="mode" data-m="watch">👀 Watch</button><button class="tab" data-act="mode" data-m="trace">✍️ Trace</button><button class="tab" data-act="mode" data-m="memory">🧠 Memory</button></div>' +
      '<div class="writeWrap"><canvas id="wc" width="400" height="400" aria-label="writing pad for ' + c.ch + '"></canvas></div>' +
      '<div id="wfb" class="wfb">Choose Watch, Trace or Memory.</div>' +
      '<div class="wordCard row"><div class="pic">' + c.pic + '</div><div class="hz">' + c.ch + '</div><div class="py">' + c.py + '</div><div class="en">' + c.en + '</div>' + speakBtn(c.ch, '🔊', 'speak') + '</div>' +
      chipsFor(c) +
      '<div class="nav"><button class="btn alt" data-act="again">↺ Again</button><button class="btn alt" data-act="hint">💡 Show me</button><button class="btn" data-act="write" data-ch="' + nextCh + '">Next ' + nextCh + ' →</button></div>');
    S.writer = new Writer(document.getElementById('wc'), c, {
      mode: 'watch',
      onFeedback: function (r) { setW(r.msg, r.ok ? 'ok' : 'bad'); },
      onComplete: function (r) {
        store.setWritten(c.ch);
        setW(r.mistakes === 0 ? '🌟 Perfect! 好极了! You wrote ' + c.ch + ' with no mistakes.' : '🎉 You wrote ' + c.ch + '! You fixed ' + r.mistakes + ' stroke' + (r.mistakes > 1 ? 's' : '') + '. Try again for a perfect one.', 'ok');
        var t = document.getElementById('starTotal'); if (t) { t.textContent = '⭐ ' + store.total(); }
        speak(c.ch);
      }
    });
    setMode(mode);
  }
  function setW(msg, cls) { var el = document.getElementById('wfb'); if (el) { el.className = 'wfb ' + (cls || ''); el.textContent = msg; } }
  function setMode(m) {
    var tabs = app.querySelectorAll('.modes .tab');
    for (var i = 0; i < tabs.length; i++) { tabs[i].classList.toggle('on', tabs[i].getAttribute('data-m') === m); }
    S.mode = m; S.writer.setMode(m);
    setW(m === 'watch' ? 'Watch how it is written. Red is the stroke being drawn; the numbers show the order.' :
         m === 'trace' ? 'Trace over the grey guide. Start at the orange number, one stroke at a time.' :
         'No guide now. Write it from memory. I will tell you if a stroke needs fixing.', '');
  }

  /* ---------------- events ---------------- */
  document.body.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act],[data-say]');
    if (!el) { return; }
    if (el.hasAttribute('data-say')) { speak(el.getAttribute('data-say'), parseFloat(el.getAttribute('data-rate')) || 0.7); return; }
    var a = el.getAttribute('data-act');
    switch (a) {
      case 'home': viewHome(); break;
      case 'learn': S.cards = []; viewLearn(el.getAttribute('data-l'), 0); break;
      case 'play': startQuiz(el.getAttribute('data-l')); break;
      case 'next': viewLearn(S.level, S.ci + 1); break;
      case 'prev': viewLearn(S.level, S.ci - 1); break;
      case 'jump': viewLearn(S.level, +el.getAttribute('data-i')); break;
      case 'ans': answer(+el.getAttribute('data-i')); break;
      case 'nextq': nextQuestion(); break;
      case 'write': viewWrite(el.getAttribute('data-ch'), 'watch'); break;
      case 'writemenu': viewWriteMenu(); break;
      case 'mode': setMode(el.getAttribute('data-m')); break;
      case 'again': setMode(S.mode); break;
      case 'hint': if (S.mode === 'watch') { S.writer.play(); } else { S.writer.hint(); } break;
      case 'hearall': speakSeq(MD.TONE_SETS[0].items.map(function (x) { return x.ch; })); break;
      case 'reset':
        if (S.resetArmed) { S.resetArmed = false; store.reset(); viewHome(); }
        else { S.resetArmed = true; el.textContent = 'Tap again to erase all progress'; }
        break;
      case 'peek': S.peek = true; viewHome(); break;
      case 'tile': tapTile(+el.getAttribute('data-id'), true); break;
      case 'untile': tapTile(+el.getAttribute('data-id'), false); break;
      case 'check': checkBuild(); break;
    }
  });
  document.getElementById('homeBtn').addEventListener('click', viewHome);

  viewHome();
})();

</script>
